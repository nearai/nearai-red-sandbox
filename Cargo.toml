[package]
name = "rts"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
description = "Sandboxed opencode sessions on mvm"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rts"
path = "src/main.rs"

# The confined Windows egress proxy (see the file).
[[bin]]
name = "rts-egress"
path = "src/bin/rts-egress.rs"

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
# TDX quote verification. Vendored unchanged from the crates.io tarball
# dcap-qvl-0.7.0.crate, sha256
# b992c9511adf7135ae7c63c023c9303a3615c0f38d7b39514dcc262f91c6adda;
# approved by Zaki 2026-10-28 for exactly these features. Never `report`,
# never default features, never `danger-allow-tcb-override`.
dcap-qvl = { path = "vendor/dcap-qvl-0.7.0", version = "=0.7.0", default-features = false, features = ["std", "ring", "default-x509"] }
hex = "0.4.3"
ring = "0.17.14"
# The pinned forwarder (src/forwarder.rs). Promoted from Cargo.lock; no new packages.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
# The forwarder pins the leaf's SubjectPublicKeyInfo (src/forwarder/pin.rs),
# parsed by the same X.509 code rustls verifies with. Promoted from Cargo.lock; no new packages.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
sha2 = "0.11.1"
# Per-response NEAR AI receipts (src/forwarder/signature.rs). Promoted from Cargo.lock; no new packages.
ed25519-dalek = "2.2.0"
ironwire_proxy = { git = "https://github.com/nearai/ironwire", rev = "53518343781063b3c39bad9c4876488800ada89e" }
# Share the embedded proxy's enforced model capacity with OpenCode.
ironwire_upstream = { git = "https://github.com/nearai/ironwire", rev = "53518343781063b3c39bad9c4876488800ada89e" }
# Update checks (src/update.rs). Promoted from Cargo.lock; no new packages.
ironwire_update = { git = "https://github.com/nearai/ironwire", rev = "53518343781063b3c39bad9c4876488800ada89e" }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
tempfile = "3"
secrecy = "0.10"
zeroize = "1"
keyring-core = "=1.0.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

# Hyper-V backend (HCS, hvsocket, job objects, owner-only DACLs). Windows
# only; the feature list is the owner-approved set, no umbrella features.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_HostComputeSystem",
    "Win32_System_Hypervisor",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
panic = "abort"

# rts-egress, the confined Windows egress proxy: built with this profile so
# whole-program optimisation leaves only the code (and DLL imports) serving
# CONNECT needs. Without it the binary links the rts library's TLS, shell
# and COM imports, whose initialisation needs a desktop an AppContainer
# process does not get. tests/windows_imports.rs checks the result.
[profile.egress]
inherits = "release"
lto = "fat"
codegen-units = 1
