[package]
name = "rts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Sandboxed opencode sessions on mvm"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rts"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
# TDX quote verification. Vendored unchanged from the crates.io tarball
# dcap-qvl-0.7.0.crate, sha256
# b992c9511adf7135ae7c63c023c9303a3615c0f38d7b39514dcc262f91c6adda;
# approved by Zaki 2026-10-28 for exactly these features. Never `report`,
# never default features, never `danger-allow-tcb-override`.
dcap-qvl = { path = "vendor/dcap-qvl-0.7.0", version = "=0.7.0", default-features = false, features = ["std", "ring", "default-x509"] }
hex = "0.4.3"
ring = "0.17.14"
# The pinned forwarder (src/forwarder.rs). Promoted from Cargo.lock; no new packages.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
# The forwarder pins the leaf's SubjectPublicKeyInfo (src/forwarder/pin.rs),
# parsed by the same X.509 code rustls verifies with. Promoted from Cargo.lock; no new packages.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["alloc"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
sha2 = "0.11.1"
# Per-response NEAR AI receipts (src/forwarder/signature.rs). Promoted from Cargo.lock; no new packages.
ed25519-dalek = "2.2.0"
ironwire_proxy = { git = "https://github.com/nearai/ironwire", rev = "bf8b90ba7b2e3b4da3011e1107a8a2068c8085bc" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
tempfile = "3"
secrecy = "0.10"
zeroize = "1"
keyring-core = "=1.0.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

[profile.release]
panic = "abort"
