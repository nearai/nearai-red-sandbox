name: linux-check

# Builds the Linux release archive exactly as release.yml's build-linux job
# does, then installs it into a prefix through rts's own release install
# (setup::install_release_components, Firecracker flavor: plugin only, no
# supervisor). Read-only token, no secrets, actions pinned by commit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-archive:
    name: release archive (as release.yml builds it)
    # ubuntu-22.04, as release.yml builds it: glibc 2.35 is the floor.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: build rts as release.yml does
        run: cargo build --locked --release --bin rts
      # $RUNNER_TEMP, as release.yml uses.
      - name: package, smoke-run, then install into a prefix
        run: |
          set -euo pipefail
          scripts/package-linux.sh --version 0.0.0-ci --rts target/release/rts --out "$RUNNER_TEMP/dist"
          archive="$RUNNER_TEMP/dist/rts-0.0.0-ci-x86_64-unknown-linux-gnu.tar.gz"
          mkdir "$RUNNER_TEMP/smoke"
          tar -xzf "$archive" -C "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/rts" --version
          floor="$(objdump -T "$RUNNER_TEMP/smoke/bin/rts" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "glibc floor: $floor"
          [ "$(printf '%s\n' GLIBC_2.35 "$floor" | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "refusing: rts needs $floor, newer than glibc 2.35" >&2; exit 1; }
          RTS_RELEASE_TAR_GZ="$archive" \
            cargo test --locked --lib -- --ignored --exact \
            setup::tests::a_built_release_tar_gz_installs_into_a_prefix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release-archive
          path: ${{ runner.temp }}/dist/
          retention-days: 3
          if-no-files-found: error
