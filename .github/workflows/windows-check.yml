name: windows-check

# Checks rts builds, lints and passes its unit tests on Windows (msvc).
# Read-only token, no secrets, actions pinned by commit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - name: cargo check
        run: cargo check --locked --target x86_64-pc-windows-msvc --all-targets
      - name: cargo clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets
      - name: unit tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --lib --bins
