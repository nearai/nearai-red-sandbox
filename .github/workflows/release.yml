# Build, sign, notarize and publish an rts release for aarch64-apple-darwin.
#
# A pushed tag v<X.Y.Z> (equal to Cargo.toml's version) publishes the GitHub
# release and merges a formula bump into nearai/homebrew-tap.
#
# A workflow_dispatch with dry_run (the default) builds, signs, notarizes,
# packages and attests, and uploads dist/ as the run artifact `dist`, but
# publishes nothing and does not touch the tap. That is how the signing
# secrets are validated and what the pre-tag install test downloads (the
# attestations exist so `gh attestation verify` works on those files). A
# dispatch never publishes: dry_run=false is refused; push a tag instead.
#
# Conventions follow TraceCommons/trace-commons release-contributor.yml:
# secret names, environment: release on the signing job, contents: write only
# on the publish job, a release-config preflight, notarization accepted only
# on a JSON status of Accepted, and a tap pull request the workflow merges.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign, notarize and attest only (a dispatch never publishes)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # contents: write lives only on the publish job. The build job holds the
  # Developer ID certificate and the notary key; it does not need repo-write.
  contents: read
  id-token: write
  attestations: write

jobs:
  release-config:
    name: verify release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse a dispatch that asks to publish
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "refusing: a workflow_dispatch never publishes; push a v<version> tag to release" >&2
          exit 1

      # Fail a tag push here rather than after the release is already public.
      - name: Confirm tag-release credentials are configured
        if: github.event_name == 'push'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "refusing to release: missing secret HOMEBREW_TAP_TOKEN (contents and pull-request write on nearai/homebrew-tap)" >&2
            exit 1
          fi

  build:
    name: build, sign, notarize, package
    needs: release-config
    # macos-26, not a retired label: a retired label queues forever instead of failing.
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      # rts --version prints CARGO_PKG_VERSION, so a tag must equal it.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          V="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing: Cargo.toml version is not X.Y.Z: $V" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "refusing to release: tag is $GITHUB_REF_NAME, Cargo.toml version is $V (expected tag v$V)" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # GNU coreutils and tar first on PATH, as opencode/README.md asks, so the
      # runner's test baseline matches the local one; shellcheck for the gate.
      - name: Install test tools
        run: |
          set -euo pipefail
          brew install coreutils gnu-tar shellcheck
          {
            echo "$(brew --prefix coreutils)/libexec/gnubin"
            echo "$(brew --prefix gnu-tar)/libexec/gnubin"
          } >> "$GITHUB_PATH"

      - name: Test gate
        run: bash scripts/release/check-tests.sh

      - name: Build rts
        run: cargo build --release --locked

      - name: Build the patched supervisor
        run: bash scripts/build-patched-mvm-supervisor.sh --install-dir "$RUNNER_TEMP/supervisor"

      # notarytool takes a zip, never a bare Mach-O, and a bare Mach-O cannot
      # be stapled: Gatekeeper looks the ticket up online on first run.
      - name: Sign and notarize
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_ASC_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_ASC_KEY_P8_BASE64 }}
          MACOS_NOTARY_ASC_KEY_ID: ${{ secrets.MACOS_NOTARY_ASC_KEY_ID }}
          MACOS_NOTARY_ASC_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP"
          RTS="target/release/rts"
          SUP="$WORK/supervisor/mvm-hvf-supervisor"
          KEYCHAIN="$WORK/rts-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
            MACOS_NOTARY_ASC_KEY_P8_BASE64 MACOS_NOTARY_ASC_KEY_ID MACOS_NOTARY_ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "refusing: secret $name is not set in the release environment" >&2
              exit 1
            fi
          done
          if ! [[ "$MACOS_SIGNING_IDENTITY" =~ ^Developer\ ID\ Application:\ .+\ \([A-Z0-9]{10}\)$ ]]; then
            echo "refusing: MACOS_SIGNING_IDENTITY must be 'Developer ID Application: <name> (<team id>)'" >&2
            exit 1
          fi

          cleanup() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            rm -f "$WORK/cert.p12" "$WORK/notary.p8" "$WORK/notary.json" "$WORK/notary-log.json"
            if [ -n "${ORIGINAL_KEYCHAINS:-}" ]; then
              # shellcheck disable=SC2086
              security list-keychains -d user -s $ORIGINAL_KEYCHAINS || true
            fi
          }
          trap cleanup EXIT

          # Capture the search list first: `security list-keychains -s`
          # replaces the list rather than adding to it.
          ORIGINAL_KEYCHAINS="$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$WORK/cert.p12"
          ( umask 077; printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$WORK/cert.p12" )
          chmod 600 "$WORK/cert.p12"
          security import "$WORK/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$WORK/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $ORIGINAL_KEYCHAINS

          matches="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -cF "\"$MACOS_SIGNING_IDENTITY\"" || true)"
          if [ "$matches" != 1 ]; then
            echo "refusing: the imported certificate holds $matches valid codesigning identities named MACOS_SIGNING_IDENTITY, expected exactly 1" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi

          codesign --force --sign "$MACOS_SIGNING_IDENTITY" --options runtime --timestamp "$RTS"
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" --options runtime --timestamp \
            --entitlements packaging/macos/mvm-hvf-supervisor.entitlements "$SUP"
          codesign --verify --strict --verbose=2 "$RTS"
          codesign --verify --strict --verbose=2 "$SUP"
          if ! codesign -d --entitlements - "$SUP" 2>&1 | grep -q com.apple.security.hypervisor; then
            echo "refusing: the signed supervisor lacks com.apple.security.hypervisor" >&2
            exit 1
          fi
          [ "$("$SUP" --rts-vsock-drain-fix-version)" = rts-vsock-drain-v1 ] || { echo "refusing: signed supervisor lacks rts-vsock-drain-v1" >&2; exit 1; }
          [ "$("$SUP" --contract-version)" = "mvm-hvf-supervisor contract-version=4" ] || { echo "refusing: signed supervisor has the wrong helper contract" >&2; exit 1; }

          mkdir -p "$WORK/notarize"
          cp "$RTS" "$SUP" "$WORK/notarize/"
          ditto -c -k --sequesterRsrc "$WORK/notarize" "$WORK/rts-notarize.zip"
          rm -f "$WORK/notary.p8"
          ( umask 077; printf '%s' "$MACOS_NOTARY_ASC_KEY_P8_BASE64" | base64 --decode > "$WORK/notary.p8" )
          chmod 600 "$WORK/notary.p8"
          # The exit status of --wait is not a verdict; the JSON status is.
          xcrun notarytool submit "$WORK/rts-notarize.zip" \
            --key "$WORK/notary.p8" \
            --key-id "$MACOS_NOTARY_ASC_KEY_ID" \
            --issuer "$MACOS_NOTARY_ASC_ISSUER_ID" \
            --wait --output-format json > "$WORK/notary.json" || true
          cat "$WORK/notary.json"
          status="$(plutil -extract status raw -o - "$WORK/notary.json" 2>/dev/null || true)"
          echo "notarization status: $status"
          if [ "$status" != Accepted ]; then
            id="$(plutil -extract id raw -o - "$WORK/notary.json" 2>/dev/null || true)"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" \
                --key "$WORK/notary.p8" \
                --key-id "$MACOS_NOTARY_ASC_KEY_ID" \
                --issuer "$MACOS_NOTARY_ASC_ISSUER_ID" || true
            fi
            echo "refusing to release: notarization returned '$status', not 'Accepted'" >&2
            exit 1
          fi

          # Only after notarization: Gatekeeper rejects an unnotarized Developer ID binary.
          # The install type, not the execute type: execute assesses app bundles
          # and rejects every bare Mach-O CLI ("does not seem to be an app",
          # exit 3), notarized or not. The verdict must name a notarized
          # Developer ID.
          assess_notarized() {
            local bin=$1 out
            out="$(spctl --assess --type install -vv "$bin" 2>&1 || true)"
            echo "$out"
            if ! grep -q 'source=Notarized Developer ID' <<<"$out"; then
              echo "refusing: $bin is not accepted as Notarized Developer ID" >&2
              exit 1
            fi
          }
          assess_notarized "$RTS"
          assess_notarized "$SUP"

      # After signing: package-release.sh checksums the signed bytes, and
      # rewrites the build-info's signed_binary_sha256 to the signed supervisor.
      - name: Package
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/package-release.sh --version "$V" --rts target/release/rts \
            --supervisor "$RUNNER_TEMP/supervisor/mvm-hvf-supervisor" \
            --build-info "$RUNNER_TEMP/supervisor/mvm-hvf-supervisor.build-info" \
            --out "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/dist" && shasum -a 256 -c SHA256SUMS)
          ls -l "$RUNNER_TEMP/dist"

      # Every run, dry runs included, so `gh attestation verify` works on the
      # dry-run artifacts in the pre-tag install test.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/rts-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
            ${{ runner.temp }}/dist/install.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    name: publish the release and the formula
    needs: build
    # The push event too, not only a tag ref: a dispatch can name a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # gh run download reads this run's artifact.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name dist --dir "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          sha256sum -c SHA256SUMS
          for f in "rts-$V-aarch64-apple-darwin.tar.gz" install.sh SHA256SUMS; do
            [ -f "$f" ] || { echo "refusing: $f is missing from the build artifact" >&2; exit 1; }
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$V" "$RUNNER_TEMP"/dist/* \
            --repo nearai/nearai-red-sandbox \
            --verify-tag \
            --title "rts $V" \
            --notes "rts $V for macOS on Apple silicon (aarch64-apple-darwin).

          Install with either:

              curl -fsSL https://github.com/nearai/nearai-red-sandbox/releases/download/v$V/install.sh | bash
              brew install nearai/tap/rts && rts setup

          rts and the bundled mvm HVF supervisor are signed with a Developer ID
          and notarized by Apple. SHA256SUMS covers the tarball and install.sh,
          and both carry GitHub build-provenance attestations:

              gh attestation verify rts-$V-aarch64-apple-darwin.tar.gz --repo nearai/nearai-red-sandbox

          rts setup then fetches mvm v0.22.0, opencode v2.2.2 and the guest
          image, each pinned by digest."

      # HOMEBREW_TAP_TOKEN: fine-grained, contents and pull-request write on
      # nearai/homebrew-tap only. github.token cannot reach another repository.
      - name: Bump and merge the formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          V: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # The hash comes only from this run's artifact.
          SHA="$(awk -v f="rts-$V-aarch64-apple-darwin.tar.gz" '$2 == f { print $1 }' "$RUNNER_TEMP/dist/SHA256SUMS")"
          if ! [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "refusing: no tarball sha256 in this run's SHA256SUMS" >&2
            exit 1
          fi
          # Token in the remote URL: GH_TOKEN authenticates gh, not git push.
          # Default branch only, so the bump branch is rebuilt from it each run
          # and nothing an earlier attempt pushed survives the force-push.
          git clone --depth 1 --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/nearai/homebrew-tap.git" "$RUNNER_TEMP/tap"
          BASE="$(git -C "$RUNNER_TEMP/tap" symbolic-ref --short HEAD)"
          BRANCH="bump-rts-$V"
          git -C "$RUNNER_TEMP/tap" switch -c "$BRANCH"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          bash scripts/release/render-formula.sh --version "$V" --sha256 "$SHA" --out "$RUNNER_TEMP/tap/Formula/rts.rb"
          cd "$RUNNER_TEMP/tap"
          grep -qF "sha256 \"$SHA\"" Formula/rts.rb || { echo "refusing: the rendered formula lacks this run's sha256" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rts.rb
          if git diff --cached --quiet; then
            echo "the tap already carries rts $V with this sha256; nothing to bump."
            exit 0
          fi
          git commit -m "rts $V"
          git push --force -u origin "$BRANCH"
          PR_URL="$(gh pr list --repo nearai/homebrew-tap --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create --repo nearai/homebrew-tap --base "$BASE" --head "$BRANCH" \
              --title "rts $V" --body "Formula bump from the nearai/nearai-red-sandbox release workflow, run $GITHUB_RUN_ID.")"
          fi
          gh pr merge "$PR_URL" --repo nearai/homebrew-tap --squash --delete-branch
          echo "formula merged: $PR_URL"
